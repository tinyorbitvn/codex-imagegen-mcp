apiVersion: v1
kind: Service
metadata:
  name: {{ include "codex-imagegen-mcp.fullname" . }}
  labels:
    {{- include "codex-imagegen-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  {{- with .Values.mcp.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "codex-imagegen-mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
