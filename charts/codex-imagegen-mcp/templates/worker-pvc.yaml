{{- if and .Values.worker.persistence.codexHome.enabled (not .Values.worker.persistence.codexHome.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "codex-imagegen-mcp.fullname" . }}-codex-home
  labels:
    {{- include "codex-imagegen-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    # Keep the sign-in when the release is uninstalled. Deleting it means
    # signing in to ChatGPT again by hand.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.worker.persistence.codexHome.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.worker.persistence.codexHome.size }}
  {{- with .Values.worker.persistence.codexHome.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.worker.persistence.work.enabled (not .Values.worker.persistence.work.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "codex-imagegen-mcp.fullname" . }}-work
  labels:
    {{- include "codex-imagegen-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  accessModes:
    {{- toYaml .Values.worker.persistence.work.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.worker.persistence.work.size }}
  {{- with .Values.worker.persistence.work.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
