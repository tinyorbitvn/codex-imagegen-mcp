{{- if .Values.redis.deploy }}
{{/*
Evaluation Redis: one pod, no persistence, no auth. It exists so a fresh
cluster can run the chart with nothing else installed. A restart loses the
queue, which means in-flight jobs are lost with it. Use your own Redis for
anything that matters.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codex-imagegen-mcp.fullname" . }}-redis
  labels:
    {{- include "codex-imagegen-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "codex-imagegen-mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "codex-imagegen-mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "codex-imagegen-mcp.image" (list . .Values.redis.image) }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codex-imagegen-mcp.fullname" . }}-redis
  labels:
    {{- include "codex-imagegen-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- include "codex-imagegen-mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
