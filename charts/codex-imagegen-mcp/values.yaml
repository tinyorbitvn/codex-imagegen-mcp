# Default values for codex-imagegen-mcp.
#
# The defaults run ONE pod that serves MCP and generates images, keeping its
# queue in memory and its images on a volume. Nothing else has to exist in
# the cluster. Set redis.* and s3.* to move those out, and split=true to run
# the MCP endpoint and the worker as separate Deployments.
#
# After installing, the Codex sign-in still has to be seeded by hand once:
# no image ships with credentials. See docs/codex-authentication.md.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: tinyorbitvn/codex-imagegen-mcp
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# false: one Deployment running both roles in one process.
# true:  two Deployments, one serving MCP and one running Codex. That needs a
#        shared queue and shared object storage, since separate processes
#        share neither memory nor a local disk, so it requires redis and s3
#        below. Use it when you want to scale or restart the endpoint without
#        touching the process that holds the ChatGPT session.
split: false

# Replicas for the MCP endpoint. Stateless, so raise it freely. Ignored for
# the worker, which stays at one because one sign-in drives one Codex
# process.
replicaCount: 1

# The URL clients are handed for a generated image. It has to resolve from
# wherever the client runs. Left empty, it is taken from the ingress host
# when one is enabled, and otherwise from the in-cluster Service name, which
# only works for clients inside the cluster.
publicBaseUrl: ""

# Jobs allowed to be waiting before new work is rejected.
queueLimit: 64

# Per-caller hourly limits. The caller comes from the
# x-agentgateway-principal, x-jwt-sub or x-user header, in that order, and
# falls back to "anonymous" — so behind an unauthenticated ingress every
# caller shares one bucket.
rateLimit:
  createImagePerHour: 10
  editImagePerHour: 20

worker:
  # Jobs at once. One ChatGPT sign-in drives one Codex process; raise this
  # only if you know the account tolerates more.
  concurrency: 1
  # A job is given up on after this long. Real jobs take 30 to 140 seconds.
  jobTimeoutSeconds: 900
  # Codex always leaves its own copy of every generated image in
  # $CODEX_HOME/generated_images, even on success, at roughly 0.7 MB per job.
  # Copies older than this are deleted. Nothing else cleans them up.
  generatedImageRetentionHours: 24
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  # The Codex sign-in. This MUST survive restarts, or every restart means
  # signing in again.
  codexHome:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    size: 1Gi
  # Generated images, when no object storage is configured. Losing this
  # volume means every URL already handed to a client stops working.
  artifacts:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  # Scratch space for jobs in flight. Safe to lose, so an emptyDir by
  # default; give it a claim if your nodes have small ephemeral disks.
  work:
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

service:
  type: ClusterIP
  port: 80
  annotations: {}

redis:
  # Point this at your own Redis, e.g. redis://redis-master.redis:6379.
  # Leave both empty to keep the queue inside the process, which is fine
  # while split is false.
  url: ""
  # A single in-chart Redis pod with NO persistence, for trying the split
  # layout without standing up a real one.
  deploy: false
  image:
    registry: docker.io
    repository: library/redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# Object storage. Leave endpoint empty to store images on the artifacts
# volume and serve them from /artifacts on the same port.
s3:
  endpoint: ""
  bucket: ""
  region: us-east-1
  # Path-style addressing (bucket in the path, not the hostname). Keep this
  # true for MinIO, Ceph RGW and most self-hosted gateways: they rarely have
  # the wildcard DNS that virtual-hosted style needs.
  forcePathStyle: true
  # Base URL clients are handed, without a trailing slash. The final link is
  # this plus "/" plus the object key, an unsigned GET, so the bucket must
  # allow anonymous download.
  publicBaseUrl: ""
  signedUrlTtlSeconds: 86400
  # Either name a Secret holding AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY,
  # or let the chart create one from the two values below.
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

# Empty endpoint disables OpenTelemetry export entirely.
otlp:
  endpoint: ""

# Ingress for the MCP endpoint.
#
# The service has NO authentication of its own. Anything that can reach /mcp
# can spend your ChatGPT quota, so put an authenticating proxy in front
# before exposing it beyond the cluster.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# The image runs as UID 10001 and the volumes are written as that user;
# changing this without changing the image stops the process writing its own
# sign-in.
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
