apiVersion: v2
name: codex-imagegen-mcp
description: MCP server that generates images with the Codex CLI, using a ChatGPT subscription instead of the paid image API. One pod by default.
type: application
# Chart version. Bump on every chart change.
version: 0.2.0
# Version of the image this chart defaults to.
appVersion: "0.5.0"
home: https://github.com/tinyorbitvn/codex-imagegen-mcp
sources:
  - https://github.com/tinyorbitvn/codex-imagegen-mcp
keywords:
  - mcp
  - codex
  - image-generation
  - claude
maintainers:
  - name: TinyOrbit
    url: https://github.com/tinyorbitvn
# No dependencies on purpose: the chart renders from a clone with nothing
# to fetch, and it never pins you to a particular Redis or S3 chart.
