# Build và đẩy hai ảnh service lên GitHub Packages (ghcr.io) khi đẩy tag `v*`.
#
# Vì sao chỉ chạy theo tag chứ không theo mỗi push: ảnh ở đây là thứ cụm kéo về
# chạy thật, nên mỗi ảnh phải ứng với một phiên bản gọi được tên. Muốn thử nhanh
# thì build tại chỗ, đừng đẻ tag rác trên registry công khai.
#
# Cả hai ảnh dùng CHUNG số phiên bản của tag: đây là một workspace npm, hai
# service chia nhau packages/*, tách phiên bản ra thì không nói được "bản nào đi
# với bản nào".
#
# Build context là GỐC repo (không phải thư mục service) vì Dockerfile COPY cả
# packages/ — xem comment trong chính Dockerfile.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Hai ảnh độc lập nhau: một cái hỏng không nên chặn cái kia publish.
      fail-fast: false
      matrix:
        service:
          - imagegen-mcp
          - codex-image-worker
    steps:
      - uses: actions/checkout@v4

      - name: Lấy số phiên bản từ tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và đẩy ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # Gốc repo, KHÔNG phải services/<tên>
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          # BASE_REGISTRY để mặc định (docker.io/library): runner công khai
          # không đi qua được hạ tầng nội bộ, và cũng không nên đi.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
          # Cache giữa các lần chạy để build lại chỉ tốn vài phút.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
