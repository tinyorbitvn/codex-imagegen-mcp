# Build both service images and publish them to GitHub Packages (ghcr.io),
# then cut a GitHub Release, whenever a `v*` tag is pushed.
#
# Why tags only, and not every push: these images are what the cluster actually
# runs, so every image must correspond to a version you can name. For quick
# experiments build locally instead of littering a public registry with tags.
#
# Both images carry the SAME version as the tag. This is one npm workspace and
# the two services share `packages/*`, so splitting their versions would make it
# impossible to say which build of one goes with which build of the other.
#
# The build context is the REPOSITORY ROOT, not the service directory, because
# each Dockerfile copies `packages/` as well. See the comments in the Dockerfiles.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # The two images are independent: one failing should not stop the other
      # from being published.
      fail-fast: false
      matrix:
        service:
          - imagegen-mcp
          - codex-image-worker
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # Repository root, not services/<name>.
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          # BASE_REGISTRY keeps its default (docker.io/library): a public runner
          # cannot reach TinyOrbit's internal registry, and should not try to.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
          # Cache between runs so a rebuild costs minutes, not tens of minutes.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    # Only cut a release once both images are actually on the registry, so the
    # pull commands in the release notes are never a lie.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the previous tag can be found for the changelog.
          fetch-depth: 0

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## Container images"
            echo
            echo "Both images are public — no login needed to pull them."
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${OWNER}/imagegen-mcp:${version}"
            echo "docker pull ghcr.io/${OWNER}/codex-image-worker:${version}"
            echo '```'
            echo
            echo "They share one version on purpose: both services live in a single npm"
            echo "workspace and depend on the same \`packages/*\`, so a matching pair is"
            echo "the only combination that is tested together."
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "${previous}..${TAG}"
              echo
              echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
            else
              echo "First release cut from this repository."
            fi
          } > release-notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
