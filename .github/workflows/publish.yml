# Build the image, publish it to GitHub Packages (ghcr.io), then cut a
# GitHub Release, whenever a `v*` tag is pushed.
#
# Why tags only, and not every push: this image is what people actually run,
# so every image must correspond to a version you can name. For quick
# experiments build locally instead of littering a public registry with tags.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # BASE_REGISTRY keeps its default (docker.io/library): a public
          # runner has no private mirror to reach, and should not try.
          tags: |
            ghcr.io/${{ github.repository_owner }}/codex-imagegen-mcp:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/codex-imagegen-mcp:latest
          # Cache between runs so a rebuild costs minutes, not tens of minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Only cut a release once the image is actually on the registry, so the
    # pull command in the release notes is never a lie.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the previous tag can be found for the changelog.
          fetch-depth: 0

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## Container image"
            echo
            echo "Public, so pulling needs no login."
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${OWNER}/codex-imagegen-mcp:${version}"
            echo '```'
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "${previous}..${TAG}"
              echo
              echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
            else
              echo "First release cut from this repository."
            fi
          } > release-notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
