# Quick-start stack for codex-imagegen-mcp.
#
#   cp .env.example .env      # optional, every value has a default
#   docker compose up -d
#   docker compose exec codex-imagegen-mcp codex login --device-auth
#   docker compose restart codex-imagegen-mcp
#
# One container. No Redis and no object storage: with neither configured the
# process keeps its queue in memory and writes images to a volume, serving
# them from the same port it serves MCP on.
#
# That is a single-machine evaluation stack. It has no TLS and no
# authentication in front of the MCP endpoint, and anything that can reach
# the port can spend your ChatGPT quota. Do not put it on a public address
# as-is; docs/deployment-kubernetes.md describes a production shape.
#
# To use a real queue and real object storage, set REDIS_URL and the S3_*
# variables in .env. Nothing else changes.

name: codex-imagegen-mcp

services:
  codex-imagegen-mcp:
    image: ghcr.io/tinyorbitvn/codex-imagegen-mcp:${IMAGE_TAG:-latest}
    build:
      context: .
    environment:
      # all = MCP endpoint and image worker in one process.
      ROLE: ${ROLE:-all}
      PORT: "8080"
      # The URL the MCP client is handed for a generated image. It has to
      # resolve from OUTSIDE this container, so it names the published port.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Empty = keep the queue in memory. Point it at a Redis to share work
      # between separate mcp and worker deployments.
      REDIS_URL: ${REDIS_URL:-}
      # Empty = store images on the artifacts volume below and serve them
      # from /artifacts. Set the S3_* block to use object storage instead.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # One Codex sign-in means one Codex process. Raising this runs several
      # jobs through the same account at once, which the account may reject.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-900}
      GENERATED_IMAGE_RETENTION_HOURS: ${GENERATED_IMAGE_RETENTION_HOURS:-24}
      QUEUE_LIMIT: ${QUEUE_LIMIT:-64}
      RATE_LIMIT_CREATE_IMAGE_PER_HOUR: ${RATE_LIMIT_CREATE_IMAGE_PER_HOUR:-10}
      RATE_LIMIT_EDIT_IMAGE_PER_HOUR: ${RATE_LIMIT_EDIT_IMAGE_PER_HOUR:-20}
    ports:
      - "${MCP_PORT:-8080}:8080"
    volumes:
      # The Codex sign-in. Nothing in the image holds credentials, and losing
      # this volume means signing in again.
      - codex-home:/home/codex/.codex
      # Generated images, when no object storage is configured.
      - artifacts:/data/artifacts
      - work:/work/jobs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  codex-home:
  artifacts:
  work:
